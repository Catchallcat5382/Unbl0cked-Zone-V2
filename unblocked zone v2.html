<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unbl0cked Zone Loader</title>
  <style>
    
  </style>
</head>
<body>
  <main id="loader">
    <h1>Loading Unbl0cked Zone</h1>
    <p>Opening the hosted live build. This single file works without an assets folder.</p>
  </main>
  <script>
    (async function () {
      function dec(parts) { return parts.map(function(p){ return atob(p); }).join(''); }
      var buildRevision = 'main';
      var buildVersion = 'live-' + buildRevision + '-' + Date.now();
      var rawBaseUrl = '';
      var pageUrl = rawBaseUrl + 'index.html';
      var communityCssUrl = rawBaseUrl + 'community/community.css';
      var scriptFiles = ['community/config.js', 'community/community.js', 'community/auth-gate.js'];
      var fallbacks = [
        'https://cdn.jsdelivr.net/gh/Catchallcat5382/Unbl0cked-Zone-V2@' + buildRevision + '/assets/',
        'https://quantil.jsdelivr.net/gh/Catchallcat5382/Unbl0cked-Zone-V2@' + buildRevision + '/assets/'
      ]
      var baseUrl = rawBaseUrl;
      var loader = document.getElementById('loader');
      try {
        var cacheKey = '?v=' + buildVersion;
        var res = await fetch(pageUrl + cacheKey, { cache: 'no-store' });
        for (var i = 0; !res.ok && i < fallbacks.length; i++) {
          res = await fetch(fallbacks[i] + 'index.html' + cacheKey, { cache: 'no-store' });
          if (res.ok) baseUrl = fallbacks[i];
        }
        if (!res.ok) throw new Error('Live build returned HTTP ' + res.status);
        var html = await res.text();
        html = html.replace(/<head([^>]*)>/i, '<head$1><script>(function(){var u=localStorage.getItem("uzMongoApiUrl")||"https://unblocked-zone.onrender.com";u=String(u).replace(/\\/+$/,"").replace("onrendered.com","onrender.com").replace("https://zone.onrender.com","https://unblocked-zone.onrender.com");if(u.indexOf("https://bullbestyoutuber.s3.us-east-1.amazonaws.com/index.html")===0)u="https://unblocked-zone.onrender.com";if(localStorage.getItem("uzMongoApiUrl")&&localStorage.getItem("uzMongoApiUrl")!==u)localStorage.setItem("uzMongoApiUrl",u);window.UZ_MONGO_API_URL=u;}());<\/script>');
        try {
            var cssRes = await fetch(baseUrl + 'community/community.css' + cacheKey, { cache: 'no-store' });
          if (cssRes.ok) {
            var css = await cssRes.text();
            html = html.replace(/<link\s+rel=["']stylesheet["']\s+href=["']community\/community\.css["']\s*>/i, '');
            html = html.replace(/<head([^>]*)>/i, '<head$1><style id="community-inline-css">' + css.replace(/<\/style/gi, '<\\/style') + '</style>');
          }
        } catch (cssErr) {}
        for (var j = 0; j < scriptFiles.length; j++) {
          try {
            var scriptUrl = baseUrl + scriptFiles[j];
            var scriptRes = await fetch(scriptUrl + cacheKey, { cache: 'no-store' });
            if (!scriptRes.ok) throw new Error(scriptFiles[j] + ' returned HTTP ' + scriptRes.status);
            var js = await scriptRes.text();
            var srcPattern = new RegExp('<script\\s+src=["\\\']' + scriptFiles[j].replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace('/', '\\/') + '["\\\']\\s*><\\/script>', 'i');
            html = html.replace(srcPattern, '<script data-inline="' + scriptFiles[j] + '">' + js.replace(/<\/script/gi, '<\\/script') + '<\\/script>');
          } catch (scriptErr) {
            throw new Error('Could not load ' + scriptFiles[j] + ': ' + (scriptErr && scriptErr.message ? scriptErr.message : scriptErr));
          }
        }
        if (/<base\s/i.test(html)) html = html.replace(/<base\s[^>]*>/i, '<base href="' + baseUrl + '">');
        else html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + baseUrl + '">');
        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        var shownApi = String(localStorage.getItem("uzMongoApiUrl")||"https://unblocked-zone.onrender.com").replace("onrendered.com","onrender.com").replace("https://zone.onrender.com","https://unblocked-zone.onrender.com");
        if (shownApi.indexOf("https://bullbestyoutuber.s3.us-east-1.amazonaws.com/index.html") === 0) shownApi = "https://unblocked-zone.onrender.com";
        loader.innerHTML = '<h1>Error 404</h1><p>Page Not Found</p><p class="err">' 
      }
    })();
  </script>
</body>
</html>
